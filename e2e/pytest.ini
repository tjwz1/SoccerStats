[pytest]
testpaths = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
timeout = 60
markers =
    navigation: breadcrumb and back-button navigation
    calendar: fixture calendar, month nav, day selection
    standings: competition standings table
    squad: team squad view and player cards
    schedule: team schedule, match cards, match detail panel
    match_detail: match detail panel (lineup / stats / timeline / h2h)
    player: player career stats page
    honours: team honours (trophies) view
    news: team news view
    search: team search — sidebar input and mobile header search
    stat_leaders: sidebar stat-leaders panel (goals / assists / clean sheets)
    favourites: team favourites workflow
    url_nav: direct URL navigation and URL-state sync
    theme: dark/light theme toggle
    mobile: mobile-specific UI (sidebar drawer, header search icon)
    consistency: same feature behaves identically across pages / entry points
    auth: accounts / authentication UI (sign-in button, modal, avatar)
    career_multi: career-stats multi-league tests (multi-club history check)
