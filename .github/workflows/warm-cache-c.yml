name: Cache Warmer — Tier C (daily)

# Daily at 06:00 UTC: forces the team-search index to build and persist, warms every
# competition's seasons list, and pre-creates next month's fixture window well ahead
# of the rollover. See .github/scripts/warm-cache.sh for what this actually does and why.

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions: {}

# Shared across all three tiers (warm-cache-a/b/c.yml) by using the same group name,
# so they queue rather than run concurrently — never both hitting the API at once.
concurrency:
  group: warm-cache
  cancel-in-progress: false

jobs:
  warm:
    runs-on: ubuntu-latest
    env:
      BYPASS: ${{ secrets.VERCEL_BYPASS_TOKEN }}
      BASE: https://soccer-stats-flame.vercel.app/api
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - run: bash .github/scripts/warm-cache.sh C
