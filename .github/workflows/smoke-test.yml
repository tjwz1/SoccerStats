name: Daily Smoke Test

on:
  schedule:
    - cron: "0 14 * * *"   # 14:00 UTC = 8:00 AM Mountain
  workflow_dispatch:

permissions:
  issues: write

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    env:
      BYPASS: ${{ secrets.VERCEL_BYPASS_TOKEN }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Ensure smoke-test label exists
        run: gh label create smoke-test --color "#e11d48" --description "Daily smoke test" --repo "$GITHUB_REPOSITORY" 2>/dev/null || true

      - name: Run smoke test
        run: |
          set +e
          BASE="https://soccer-stats-flame.vercel.app/api"
          PASS=0; FAIL=0; SKIP=0
          LOGFILE=$(mktemp)

          check() {
            local label="$1" url="$2" out code line
            out=$(curl -s -w "\n__STATUS__%{http_code}" \
              -H "x-vercel-protection-bypass: $BYPASS" \
              --max-time 65 \
              "$url" 2>/dev/null || true)
            code=$(printf '%s' "$out" | tail -n1 | sed 's/__STATUS__//')
            case "$code" in
              200) line="PASS -- $label ($code)";               PASS=$((PASS+1)) ;;
              403) line="SKIP -- $label ($code, paid tier)";    SKIP=$((SKIP+1)) ;;
              404) line="PASS -- $label ($code, not yet available)"; PASS=$((PASS+1)) ;;
              "")  line="FAIL -- $label (no response / timeout)";    FAIL=$((FAIL+1)) ;;
              *)   line="FAIL -- $label (HTTP $code)";               FAIL=$((FAIL+1)) ;;
            esac
            echo "$line" | tee -a "$LOGFILE"
          }

          # Like check() but treats 504 as SKIP — used for competitions where fd.org's
          # upstream endpoint is occasionally unavailable (e.g. BSA off-season), so a
          # timeout there means "data unavailable", not a server regression.
          check_soft() {
            local label="$1" url="$2" out code line
            out=$(curl -s -w "\n__STATUS__%{http_code}" \
              -H "x-vercel-protection-bypass: $BYPASS" \
              --max-time 65 \
              "$url" 2>/dev/null || true)
            code=$(printf '%s' "$out" | tail -n1 | sed 's/__STATUS__//')
            case "$code" in
              200) line="PASS -- $label ($code)";                         PASS=$((PASS+1)) ;;
              403|504) line="SKIP -- $label ($code, upstream unavailable)"; SKIP=$((SKIP+1)) ;;
              404) line="PASS -- $label ($code, not yet available)";      PASS=$((PASS+1)) ;;
              "")  line="FAIL -- $label (no response / timeout)";         FAIL=$((FAIL+1)) ;;
              *)   line="FAIL -- $label (HTTP $code)";                    FAIL=$((FAIL+1)) ;;
            esac
            echo "$line" | tee -a "$LOGFILE"
          }

          # Like check() but also accepts 500+timeout as PASS — the player-career
          # endpoint has a 20 s server-side hard cap on first cold load; the
          # background scrape continues and populates Supabase, so "timed out" is
          # an expected first-run outcome rather than a real failure.
          check_player() {
            local label="$1" url="$2" out code body line
            out=$(curl -s -w "\n__STATUS__%{http_code}" \
              -H "x-vercel-protection-bypass: $BYPASS" \
              --max-time 35 \
              "$url" 2>/dev/null || true)
            code=$(printf '%s' "$out" | tail -n1 | sed 's/__STATUS__//')
            body=$(printf '%s' "$out" | sed '$d')
            if [ "$code" = "200" ]; then
              line="PASS -- $label (200)";                           PASS=$((PASS+1))
            elif [ "$code" = "403" ]; then
              line="SKIP -- $label (403, paid tier)";                SKIP=$((SKIP+1))
            elif [ "$code" = "500" ] && printf '%s' "$body" | grep -q "timed out"; then
              line="PASS -- $label (500/timeout, cache primed)";     PASS=$((PASS+1))
            elif [ -z "$code" ]; then
              line="FAIL -- $label (no response / timeout)";         FAIL=$((FAIL+1))
            else
              line="FAIL -- $label (HTTP $code)";                    FAIL=$((FAIL+1))
            fi
            echo "$line" | tee -a "$LOGFILE"
          }

          # ── CORE ─────────────────────────────────────────────────────────────
          check "1.  Health"            "$BASE/health"
          HB=$(curl -s --max-time 65 -H "x-vercel-protection-bypass: $BYPASS" "$BASE/health" 2>/dev/null || true)
          if printf '%s' "$HB" | grep -q '"mock":false'; then
            LINE="PASS - 1b. mock:false"; PASS=$((PASS+1))
          else
            LINE="FAIL - 1b. mock is true or missing: $HB"; FAIL=$((FAIL+1))
          fi
          echo "$LINE" | tee -a "$LOGFILE"

          check "2.  Competitions list" "$BASE/competitions"
          check "3.  Live matches"      "$BASE/live-matches"

          # ── STANDINGS ────────────────────────────────────────────────────────
          check "4.  PL standings"     "$BASE/competitions/PL/standings"
          check "5.  ELC standings"    "$BASE/competitions/ELC/standings"
          check "6.  BL1 standings"    "$BASE/competitions/BL1/standings"
          check "7.  SA standings"     "$BASE/competitions/SA/standings"
          check "8.  FL1 standings"    "$BASE/competitions/FL1/standings"
          check "9.  PD standings"     "$BASE/competitions/PD/standings"
          check "10. DED standings"    "$BASE/competitions/DED/standings"
          check "11. PPL standings"    "$BASE/competitions/PPL/standings"
          check_soft "12. BSA standings" "$BASE/competitions/BSA/standings"
          check "13. CL standings"     "$BASE/competitions/CL/standings"
          check "14. WC standings"     "$BASE/competitions/WC/standings"
          check "15. CLI standings"    "$BASE/competitions/CLI/standings"

          # Pause — ~16 football-data.org calls so far; respect 10 req/min limit
          echo "--- rate-limit pause (30s) ---" | tee -a "$LOGFILE"
          sleep 30

          # ── BRACKETS & TEAMS ─────────────────────────────────────────────────
          check "16. CL bracket"       "$BASE/competitions/CL/bracket"
          check "17. WC bracket"       "$BASE/competitions/WC/bracket"
          check "18. PL teams"         "$BASE/competitions/PL/teams"
          check "19. WC teams"         "$BASE/competitions/WC/teams"
          check "20. CL teams"         "$BASE/competitions/CL/teams"

          # ── SCORERS ──────────────────────────────────────────────────────────
          check "21. WC scorers"       "$BASE/competitions/WC/scorers"
          check "22. CL scorers"       "$BASE/competitions/CL/scorers"
          check "23. PL scorers"       "$BASE/competitions/PL/scorers"
          check "24. BL1 scorers"      "$BASE/competitions/BL1/scorers"
          check "25. SA scorers"       "$BASE/competitions/SA/scorers"

          # Pause before team-specific calls (each hits a fresh Vercel instance)
          echo "--- rate-limit pause (30s) ---" | tee -a "$LOGFILE"
          sleep 30

          # ── TEAM SCHEDULES ───────────────────────────────────────────────────
          check "26. England WC schedule"   "$BASE/teams/770/schedule?competition=WC&name=England"
          check "27. Arsenal PL schedule"   "$BASE/teams/57/schedule?competition=PL&name=Arsenal"
          check "28. Bayern BL1 schedule"   "$BASE/teams/5/schedule?competition=BL1&name=Bayern%20Munich"
          check "29. Juventus SA schedule"  "$BASE/teams/109/schedule?competition=SA&name=Juventus"
          check "30. PSG FL1 schedule"      "$BASE/teams/524/schedule?competition=FL1&name=PSG"

          # ── LINEUPS ──────────────────────────────────────────────────────────
          check "31. Arsenal PL lineup"     "$BASE/teams/57/lineup?competition=PL"
          check "32. Bayern BL1 lineup"     "$BASE/teams/5/lineup?competition=BL1"
          check "33. England WC lineup"     "$BASE/teams/770/lineup?competition=WC"

          # Pause before additional endpoint checks
          echo "--- rate-limit pause (30s) ---" | tee -a "$LOGFILE"
          sleep 30

          # ── ADDITIONAL ENDPOINTS ──────────────────────────────────────────────
          # Prime the player-career Supabase cache in the background.
          # The first cold call triggers a Wiki/TM scrape that may exceed the
          # server's 20 s hard cap; the background task continues and writes to
          # Supabase so check 48 (after 34-47 have run) hits the cache.
          curl -s -H "x-vercel-protection-bypass: $BYPASS" --max-time 25 \
            "$BASE/players/38101?competition=PL" -o /dev/null 2>/dev/null &
          PLAYER_PRIME_PID=$!

          check "34. PSG FL1 lineup"      "$BASE/teams/524/lineup?competition=FL1"
          check "35. Juventus SA lineup"  "$BASE/teams/109/lineup?competition=SA"
          check "36. PL live-scorers"     "$BASE/competitions/PL/live-scorers"
          check "37. PL seasons"          "$BASE/competitions/PL/seasons"
          check "38. EC standings"        "$BASE/competitions/EC/standings"
          check "39. FL1 scorers"         "$BASE/competitions/FL1/scorers"
          check "40. PD scorers"          "$BASE/competitions/PD/scorers"

          # Pause before extra coverage block
          echo "--- rate-limit pause (30s) ---" | tee -a "$LOGFILE"
          sleep 30

          # ── EXTRA COVERAGE ───────────────────────────────────────────────────
          check "41. BL1 live-scorers"      "$BASE/competitions/BL1/live-scorers"
          check "42. BL1 seasons"           "$BASE/competitions/BL1/seasons"
          check_soft "43. EC bracket"       "$BASE/competitions/EC/bracket"
          check "44. Barcelona PD lineup"   "$BASE/teams/81/lineup?competition=PD"
          check "45. DED scorers"           "$BASE/competitions/DED/scorers"
          check "46. PL fixtures"           "$BASE/competitions/PL/fixtures"
          check "47. CL fixtures"           "$BASE/competitions/CL/fixtures"

          # Wait for the priming curl to return, then give the server 10 s for
          # the background Wiki/TM scrape to finish writing to Supabase.
          wait $PLAYER_PRIME_PID
          sleep 10
          check_player "48. Player career (Haaland)" "$BASE/players/38101?competition=PL"

          # ── SUMMARY ──────────────────────────────────────────────────────────
          SUMMARY="PASS=$PASS SKIP=$SKIP FAIL=$FAIL"
          echo "" | tee -a "$LOGFILE"
          echo "=== SMOKE TEST COMPLETE: $SUMMARY ===" | tee -a "$LOGFILE"

          # GitHub Step Summary (visible in Actions UI)
          {
            echo "## Smoke Test — $(date -u '+%Y-%m-%d')"
            [ "$FAIL" -gt 0 ] && echo "**Status: FAILED** — $SUMMARY" || echo "**Status: PASSED** — $SUMMARY"
            echo '```'
            cat "$LOGFILE"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          # Post results to tracking issue so they're readable without copy-paste
          ISSUE_NUMBER=$(gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --label smoke-test \
            --state open \
            --limit 1 \
            --json number \
            --jq '.[0].number // empty' 2>/dev/null)

          if [ -z "$ISSUE_NUMBER" ]; then
            ISSUE_URL=$(gh issue create \
              --repo "$GITHUB_REPOSITORY" \
              --title "Daily Smoke Test Tracking" \
              --label smoke-test \
              --body "Automated daily smoke test results — one comment per run." 2>/dev/null)
            ISSUE_NUMBER=$(echo "$ISSUE_URL" | grep -oE '[0-9]+$')
          fi

          if [ -n "$ISSUE_NUMBER" ]; then
            STATUS_ICON=$([ "$FAIL" -gt 0 ] && echo "❌" || echo "✅")
            RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            COMMENT_FILE=$(mktemp)
            {
              printf '%s\n\n```\n' "${STATUS_ICON} **$(date -u '+%Y-%m-%d')** — ${SUMMARY} — [Run #${GITHUB_RUN_NUMBER}](${RUN_URL})"
              cat "$LOGFILE"
              printf '```\n'
            } > "$COMMENT_FILE"
            gh issue comment "$ISSUE_NUMBER" \
              --repo "$GITHUB_REPOSITORY" \
              --body-file "$COMMENT_FILE"
            rm -f "$COMMENT_FILE"
          fi

          # Keep log for artifact upload (moved rm to after upload)
          cp "$LOGFILE" "$RUNNER_TEMP/smoke-test.log" 2>/dev/null || true
          rm -f "$LOGFILE"

          if [ "$FAIL" -gt 0 ]; then
            echo "ACTION NEEDED: Review FAIL lines above."
            exit 1
          fi

      - name: Upload log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-log
          path: ${{ runner.temp }}/smoke-test.log
          retention-days: 7
